<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visitors Board</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#F6F5F1;
  --surface:#FFFFFF;
  --ink:#1E2321;
  --ink-soft:#6B7168;
  --line:#DFDCD3;
  --line-soft:#EBE9E2;
  --weekend:#EFEDE6;
  --today:#1E2321;
  --danger:#9C4B3E;
  --c1:#2F6690; /* ocean */
  --c2:#5C7A4E; /* sage */
  --c3:#B8842E; /* amber */
  --c4:#7A5680; /* plum */
  --c5:#9C5340; /* rust */
  --c6:#3E7C6E; /* teal */
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;}
body{
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  color:var(--ink);
  padding:28px;
  min-height:100vh;
}

.board{
  max-width:1080px;
  margin:0 auto;
}

/* Header */
.top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.title-block h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:-0.01em;
  margin:0 0 4px 0;
}
.title-block p{
  margin:0;
  font-size:13px;
  color:var(--ink-soft);
}
.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:7px;
  transition:border-color .15s ease, background .15s ease;
}
.btn:hover{border-color:var(--ink);}
.btn:focus-visible{outline:2px solid var(--c1); outline-offset:2px;}
.btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn-primary:hover{background:#000;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--line-soft); border-color:transparent;}
.btn-danger{color:var(--danger); border-color:var(--line);}
.btn-danger:hover{border-color:var(--danger);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.admin-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:6px 10px;
  border-radius:999px;
  background:var(--line-soft);
  color:var(--ink-soft);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.admin-pill.on{background:#FBF1E1; color:var(--c3);}
.admin-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);}
.admin-pill.on .dot{background:var(--c3);}
.admin-pill.view-only{background:#EAF1EC; color:var(--c2);}
.admin-pill.view-only .dot{background:var(--c2);}

/* Month nav */
.monthnav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.monthnav .label{
  font-family:'Space Grotesk',sans-serif;
  font-weight:600;
  font-size:16px;
  min-width:170px;
  text-align:center;
}
.navbtn{
  width:32px;height:32px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:15px;
}
.navbtn:hover{border-color:var(--ink);}

/* Keytags row */
.keytags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}
.keytag{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:8px 8px 8px 2px;
  padding:6px 10px 6px 8px;
  font-size:12.5px;
  font-weight:500;
  position:relative;
}
.keytag::before{
  content:'';
  width:9px;height:9px;
  border-radius:50%;
  background:var(--tag-color, var(--c1));
  border:2px solid var(--surface);
  outline:1px solid var(--tag-color, var(--c1));
}
.keytag .ring{
  width:0;
}
.keytag input.rename{
  border:none;background:transparent;font:inherit;color:inherit;
  width:auto; max-width:120px;
  padding:0;
}
.keytag input.rename:focus{outline:none; border-bottom:1px solid var(--ink-soft);}
.keytag .del{
  border:none;background:transparent;color:var(--ink-soft);
  cursor:pointer; font-size:13px; padding:0 0 0 2px; line-height:1;
}
.keytag .del:hover{color:var(--danger);}
.keytag.add{
  cursor:pointer; color:var(--ink-soft); border-style:dashed;
}
.keytag.add:hover{color:var(--ink); border-color:var(--ink-soft);}

/* Tabs */
.tabs{
  display:flex;
  gap:4px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}
.tab{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  background:none;
  border:none;
  padding:10px 4px;
  margin-right:18px;
  cursor:pointer;
  position:relative;
  top:1px;
}
.tab.active{
  color:var(--ink);
  border-bottom:2px solid var(--ink);
}
.tab:hover:not(.active){color:var(--ink);}
.tab-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:var(--danger);
  color:#fff;
  font-size:10.5px;
  font-weight:700;
}

/* List view */
.list-table{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.list-row{
  display:grid;
  grid-template-columns: 4px 1fr 1fr 0.6fr 1fr 1fr 0.9fr 0.9fr 28px;
  align-items:center;
  gap:12px;
  padding:13px 16px;
  border-bottom:1px solid var(--line-soft);
  font-size:13px;
}
.list-row:last-child{border-bottom:none;}
.list-row.header{
  background:var(--line-soft);
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-soft);
  padding:11px 16px;
}
.list-row .swatch-col{width:4px; align-self:stretch; border-radius:2px;}
.list-row .prop-col{font-weight:600;}
.list-row .guest-col{font-weight:500;}
.list-row .guests-col{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft);}
.list-row .dates-col{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
.list-row .notes-col{color:var(--ink-soft); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.list-row .flag{
  display:inline-block;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.03em;
  color:var(--danger);
  background:#F7EAE7;
  padding:2px 6px;
  border-radius:4px;
  margin-left:8px;
}
.list-row .edit-col{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:13px;}
.list-row .edit-col:hover{color:var(--ink);}
.list-empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

@media (max-width:640px){
  .list-row{grid-template-columns:4px 1fr 0.6fr 24px; }
  .list-row .dates-col, .list-row .notes-col{display:none;}
}
.chart-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.chart{
  display:grid;
  grid-template-columns:150px 1fr;
}
.chart-label-col{
  border-right:1px solid var(--line);
}
.chart-days-col{
  overflow-x:auto;
}
.label-header, .day-header-row{
  height:40px;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
  background:var(--line-soft);
}
.label-header{
  padding:0 14px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-soft);
}
.day-header-row{
  display:grid;
}
.day-header{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  border-right:1px solid var(--line-soft);
  position:relative;
}
.day-header .num{font-size:12px; font-weight:600; color:var(--ink);}
.day-header.weekend{background:var(--weekend);}
.day-header.today .num{
  color:#fff;
  background:var(--today);
  width:18px;height:18px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

.prop-label{
  height:56px;
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:13px;
  font-weight:600;
  border-bottom:1px solid var(--line-soft);
  gap:8px;
}
.prop-label .sw{width:8px;height:8px;border-radius:50%;flex:none;}

.prop-row{
  height:56px;
  display:grid;
  position:relative;
  border-bottom:1px solid var(--line-soft);
}
.day-cell{
  border-right:1px solid var(--line-soft);
  position:relative;
}
.day-cell.weekend{background:var(--weekend);}
.day-cell.double{background:#F0C9C1;}
.day-cell.double.weekend{background:#EABFB6;}
.day-cell.today::after{
  content:'';
  position:absolute; top:0; bottom:0; left:0;
  border-left:1.5px dashed var(--ink);
  opacity:.35;
}
.day-cell.clickable{cursor:pointer;}
.day-cell.clickable:hover{background:#EFF3F0;}

.bar{
  position:relative;
  align-self:center;
  margin:0 2px;
  height:30px;
  border-radius:7px;
  display:flex;
  align-items:center;
  padding:0 9px;
  font-size:12px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.bar:hover{filter:brightness(1.06);}
.bar.clip-start{border-top-left-radius:2px; border-bottom-left-radius:2px;}
.bar.clip-end{border-top-right-radius:2px; border-bottom-right-radius:2px;}

/* Whole-bar red outline — replaced by the scoped .bar-overlap highlight below, kept here in case it's wanted again:
.bar.bar-doubled{
  box-shadow:0 0 0 2px var(--danger), 0 1px 2px rgba(0,0,0,.08);
}
*/

.bar-pending{
  background:repeating-linear-gradient(135deg, #C7C4B9, #C7C4B9 6px, #D6D3C8 6px, #D6D3C8 12px);
  color:var(--ink);
  border:1px dashed #A8A497;
  font-style:italic;
  box-shadow:none;
}
.bar-pending:hover{filter:none; background:repeating-linear-gradient(135deg, #BDBAAE, #BDBAAE 6px, #CCC9BD 6px, #CCC9BD 12px);}

.bar-overlap{
  position:absolute;
  top:10px;
  height:36px;
  border-radius:8px;
  background:var(--danger);
  border:2px solid #7A382D;
  margin:0 1px;
  pointer-events:none;
  z-index:5;
  box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 2px 8px rgba(156,75,62,.5);
}
.bar-overlap::before{
  content:'⚠';
  position:absolute;
  top:-9px;
  left:-2px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--danger);
  color:#fff;
  font-size:11px;
  line-height:18px;
  text-align:center;
  box-shadow:0 0 0 2px var(--surface);
}

.empty-state{
  padding:40px 20px;
  text-align:center;
  color:var(--ink-soft);
  font-size:13.5px;
}

/* Upcoming list */
.upcoming{
  margin-top:26px;
}
.upcoming h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:600;
  margin:0 0 10px 0;
}
.upc-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 4px;
  border-bottom:1px solid var(--line-soft);
  font-size:13px;
}
.upc-item:last-child{border-bottom:none;}
.upc-item .sw{width:8px;height:8px;border-radius:50%;flex:none;}
.upc-item .who{font-weight:600; flex:none;}
.upc-item .prop{color:var(--ink-soft); flex:none;}
.upc-item .dates{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
.upc-item .edit{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0 0 0 8px;}
.upc-item .edit:hover{color:var(--ink);}

/* Modal */
.overlay{
  position:fixed; inset:0;
  background:rgba(30,35,33,.42);
  display:flex; align-items:center; justify-content:center;
  z-index:50;
  padding:20px;
}
.modal{
  background:var(--surface);
  border-radius:14px;
  width:100%;
  max-width:380px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}
.modal h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;
  margin:0 0 16px 0;
}
.field{margin-bottom:14px;}
.field label{
  display:block; font-size:11.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px;
}
.field input, .field select{
  width:100%;
  font:inherit; font-size:14px;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--bg);
  color:var(--ink);
}
.field input:focus, .field select:focus{outline:2px solid var(--c1); outline-offset:0; border-color:transparent;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.modal-actions{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:18px; gap:8px;
}
.modal-actions .right{display:flex; gap:8px;}
.err{color:var(--danger); font-size:12.5px; margin:-6px 0 12px 0; min-height:1em;}

.pin-boxes{display:flex; gap:8px; margin-bottom:6px;}
.pin-boxes input{
  width:44px; height:48px; text-align:center; font-size:20px;
  font-family:'JetBrains Mono',monospace;
}

.foot-note{
  margin-top:22px;
  font-size:11.5px;
  color:var(--ink-soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.foot-note a{color:inherit;}

@media (max-width:640px){
  .chart{grid-template-columns:110px 1fr;}
  .prop-label{padding:0 8px; font-size:12px;}
  .label-header{padding:0 8px;}
}
</style>
</head>

<div class="board" id="app">Loading…</div>

<script>
const PALETTE = ['c1','c2','c3','c4','c5','c6'];
const STORAGE_KEYS = { properties:'bc-properties', bookings:'bc-bookings', pin:'bc-admin-pin', requests:'bc-requests' };

// --- Storage backend: Firebase Firestore -------------------------------
// Fill in your project's config below (from Firebase console > Project
// settings > Your apps > web app). Firebase's SDK handles CORS correctly
// out of the box, unlike the Google Apps Script approach — no JSONP or
// hidden-form workarounds needed.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBcLCYRLTl5WR-zPZ8c4vK-Os3a0XyTcIw",
  authDomain: "visitor-booking-tracker.firebaseapp.com",
  projectId: "visitor-booking-tracker",
  storageBucket: "visitor-booking-tracker.firebasestorage.app",
  messagingSenderId: "459833513891",
  appId: "1:459833513891:web:752fc169141f1743e4ac16",
};

let lastStorageError = '';
let _db = null;

function getDb(){
  if(_db) return _db;
  if(!FIREBASE_CONFIG.apiKey){ lastStorageError = 'Firebase config not set'; return null; }
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  _db = firebase.firestore();
  return _db;
}

async function storageGet(key){
  const db = getDb();
  if(!db) return null;
  try{
    const doc = await db.collection('data').doc(key).get();
    if(!doc.exists) return null;
    const value = doc.data().value;
    return (value !== undefined && value !== null && value !== '') ? { key, value } : null;
  }catch(e){
    lastStorageError = `Firestore get error: ${e.message || e}`;
    netLog('Firestore get failed', key, e);
    return null;
  }
}

async function storageSet(key, value){
  const db = getDb();
  if(!db) return false;
  try{
    await db.collection('data').doc(key).set({ value });
    return true;
  }catch(e){
    lastStorageError = `Firestore set error: ${e.message || e}`;
    netLog('Firestore set failed', key, e);
    return false;
  }
}

/* ---------------------------------------------------------------------
 * GOOGLE SHEETS BACKEND (disabled) — kept here for reference. Works
 * outside Claude but had unreliable CORS behavior with Apps Script.
 * To re-enable: swap in these functions and the JSONP/iframe helpers
 * below, plus set SHEETS_API_URL.

const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbzFer-H8Oq53dzXY8SXBix1Cr7p3wZMIK_bILjL5_8H4QSFBSy9t_Hfjha34Xp77qIE/exec';
let jsonpCounter = 0;

function jsonpRequest(url, timeoutMs=20000){
  return new Promise((resolve)=>{
    const cbName = `__sheetsCb${Date.now()}_${jsonpCounter++}`;
    const script = document.createElement('script');
    let done = false;
    const cleanup = ()=>{
      try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    window[cbName] = (data)=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = ()=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(undefined);
    };
    const sep = url.includes('?') ? '&' : '?';
    script.src = `${url}${sep}callback=${cbName}`;
    document.head.appendChild(script);
    setTimeout(()=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(undefined);
    }, timeoutMs);
  });
}

function iframeFormPost(url, fields, timeoutMs=20000){
  return new Promise((resolve)=>{
    const iframeName = `__sheetsPost${Date.now()}`;
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.action = url;
    form.method = 'POST';
    form.target = iframeName;
    form.style.display = 'none';
    Object.entries(fields).forEach(([k,v])=>{
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = k;
      input.value = v;
      form.appendChild(input);
    });
    document.body.appendChild(form);

    let done = false;
    const cleanup = ()=>{
      if(form.parentNode) form.parentNode.removeChild(form);
      setTimeout(()=>{ if(iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 500);
    };
    iframe.onload = ()=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(true);
    };
    form.submit();
    setTimeout(()=>{
      if(done) return;
      done = true;
      cleanup();
      resolve(false);
    }, timeoutMs);
  });
}

async function storageGetViaSheets(key){
  if(!SHEETS_API_URL) { lastStorageError = 'Sheets URL not configured'; return null; }
  try{
    const data = await jsonpRequest(`${SHEETS_API_URL}?key=${encodeURIComponent(key)}`);
    if(data === undefined){ lastStorageError = 'GET timed out or failed to load'; return null; }
    return (data && data.value !== undefined && data.value !== null && data.value !== '') ? data : null;
  }catch(e){
    lastStorageError = `GET error: ${e.message || e}`;
    netLog('Sheets get failed', key, e);
    return null;
  }
}

async function storageSetViaSheets(key, value){
  if(!SHEETS_API_URL) { lastStorageError = 'Sheets URL not configured'; return false; }
  try{
    const submitted = await iframeFormPost(SHEETS_API_URL, { payload: JSON.stringify({ key, value }) });
    if(!submitted){ lastStorageError = 'POST timed out — the write may not have completed'; return false; }
    const check = await storageGetViaSheets(key);
    const ok = !!check && String(check.value) === String(value);
    if(!ok) lastStorageError = 'Write could not be verified — the value on the sheet did not match';
    return ok;
  }catch(e){
    lastStorageError = `POST error: ${e.message || e}`;
    netLog('Sheets set failed', key, e);
    return false;
  }
}
* --------------------------------------------------------------------- */

/* ---------------------------------------------------------------------
 * CLAUDE STORAGE BACKEND (disabled) — kept here in case this same file is
 * ever hosted back inside a Claude artifact instead of GitHub Pages/etc.
 * Claude's window.storage API only exists inside the Claude sandbox, so
 * this cannot work when self-hosted elsewhere.

async function storageGet(key){
  try{
    const data = await window.storage.get(key, true);
    return (data && data.value !== undefined && data.value !== null && data.value !== '') ? data : null;
  }catch(e){
    lastStorageError = `Storage get error: ${e.message || e}`;
    netLog('Storage get failed', key, e);
    return null;
  }
}

async function storageSet(key, value){
  try{
    const r = await window.storage.set(key, value, true);
    if(!r){ lastStorageError = 'Storage set returned no result'; return false; }
    return true;
  }catch(e){
    lastStorageError = `Storage set error: ${e.message || e}`;
    netLog('Storage set failed', key, e);
    return false;
  }
}

function devLog(...args){
  // Only surface general console noise to admins — view-only visitors get a clean console.
  if(state.adminUnlocked) console.error(...args);
}
function netLog(...args){
  // Storage/network failures always log, regardless of admin state — needed to diagnose
  // "request didn't save" issues, which by definition happen to non-admin visitors.
  console.error(...args);
}

function showConfirm(message, opts={}){
  const { confirmLabel='Yes', cancelLabel='No', danger=true, title='Are you sure?' } = opts;
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.style.zIndex = '80';
    ov.innerHTML = `<div class="modal">
      <h3>${escapeHtml(title)}</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:-8px 0 18px 0;">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="scNo">${escapeHtml(cancelLabel)}</button>
        <div class="right"><button class="btn ${danger?'btn-danger':'btn-primary'}" id="scYes">${escapeHtml(confirmLabel)}</button></div>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const cleanup = (result)=>{ ov.remove(); resolve(result); };
    ov.querySelector('#scNo').onclick = ()=>cleanup(false);
    ov.querySelector('#scYes').onclick = ()=>cleanup(true);
    ov.onclick = (e)=>{ if(e.target===ov) cleanup(false); };
  });
}

function buildRequestMailto(req, propName){
  const to = (EMAIL_CONFIG.notifyEmail || '').split(',').map(a=>a.trim()).filter(Boolean).join(',');
  const subject = `Date request: ${propName} (${req.checkin} to ${req.checkout})`;
  const body =
`New date request submitted on the Visitors Board.

Property: ${propName}
Requested by: ${req.guest}
Guests: ${req.numGuests || 1}
Check-in: ${req.checkin}
Check-out: ${req.checkout}
Message: ${req.notes || '(none)'}

Open the board to approve or decline this request.`;
  return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

async function sendRequestEmail(req, propName){
  const { serviceId, templateId, publicKey, notifyEmail } = EMAIL_CONFIG;
  if(!serviceId || !templateId || !publicKey || !notifyEmail) return { sent:false, reason:'not-configured' };
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        service_id: serviceId,
        template_id: templateId,
        user_id: publicKey,
        template_params: {
          to_email: notifyEmail,
          guest: req.guest,
          num_guests: req.numGuests || 1,
          property: propName,
          checkin: req.checkin,
          checkout: req.checkout,
          notes: req.notes || '(none)',
        },
      }),
    });
    if(!res.ok) return { sent:false, reason:'send-failed' };
    return { sent:true };
  }catch(e){
    devLog('Email send failed', e);
    return { sent:false, reason:'send-failed' };
  }
}
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return {y, m:m-1, d}; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function todayISO(){ const t=new Date(); return isoDate(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmtShort(iso){
  const {m,d} = parseISO(iso);
  const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[m]} ${d}`;
}
function monthLabel(y,m){
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${names[m]} ${y}`;
}

async function load(){
  try{
    const [p, b, pin, r] = await Promise.all([
      storageGet(STORAGE_KEYS.properties),
      storageGet(STORAGE_KEYS.bookings),
      storageGet(STORAGE_KEYS.pin),
      storageGet(STORAGE_KEYS.requests),
    ]);
    state.properties = p ? JSON.parse(p.value) : [
      {id:uid(), name:'Floreat Farm', color:'c1'},
      {id:uid(), name:'Empire Square', color:'c2'},
    ];
    state.bookings = b ? JSON.parse(b.value) : [];
    state.requests = r ? JSON.parse(r.value) : [];
    state.pinSet = !!pin;
    if(!p || !b){ await saveProperties(); await saveBookings(); }
    if(!r){ await saveRequests(); }
    if(!pin){ await savePin('2436'); }
  }catch(e){
    devLog('Load error', e);
    state.properties = [{id:uid(), name:'Property A', color:'c1'}];
    state.bookings = [];
    state.requests = [];
  }
  state.loading = false;
  render();
}

async function saveProperties(){
  try{ const r = await storageSet(STORAGE_KEYS.properties, JSON.stringify(state.properties)); return r; }
  catch(e){ devLog('Save properties failed', e); return false; }
}
async function saveBookings(){
  try{ const r = await storageSet(STORAGE_KEYS.bookings, JSON.stringify(state.bookings)); return r; }
  catch(e){ devLog('Save bookings failed', e); return false; }
}
async function saveRequests(){
  try{ const r = await storageSet(STORAGE_KEYS.requests, JSON.stringify(state.requests)); return r; }
  catch(e){ devLog('Save requests failed', e); return false; }
}
async function savePin(pin){
  try{ const r = await storageSet(STORAGE_KEYS.pin, pin); state.pinSet = true; return r; }
  catch(e){ devLog('Save pin failed', e); return false; }
}

function colorVar(c){ return `var(--${c})`; }

        ? `<input class="rename" value="${escapeAttr(p.name)}" data-rename="${p.id}" size="${Math.max(4,p.name.length)}">

        : `<span>${escapeHtml(p.name)}</span>`}
    </div>`;
  });
  if(state.adminUnlocked){
    html += `<div class="keytag add" id="addProp">+ Add property</div>`;

function renderRequestsTab(){
  const sorted = [...state.requests].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  const cols = '4px 0.9fr 0.9fr 0.5fr 1.1fr 0.8fr 0.8fr 1fr 130px';
  let html = `<div class="list-table">`;
  html += `<div class="list-row header" style="grid-template-columns:${cols};">
    <span></span><span>Property</span><span>Requested by</span><span>Guests</span><span>Dates</span><span>Submitted</span><span>Approved</span><span>Message</span><span></span>
  </div>`;
  if(sorted.length===0){
    html += `<div class="list-empty">No requests yet. When a visitor asks for dates, they'll show up here.</div>`;
  } else {
    sorted.forEach(r=>{
      const prop = state.properties.find(p=>p.id===r.propertyId);
      const overlap = r.status==='pending' && state.bookings.some(b=> b.status!=='deleted' && b.propertyId===r.propertyId && r.checkin < b.checkout && r.checkout > b.checkin);
      html += `<div class="list-row" style="grid-template-columns:${cols}; ${r.status!=='pending'?'opacity:.5;':''}">
        <span class="swatch-col" style="background:${prop?colorVar(prop.color):'#ccc'}"></span>
        <span class="prop-col">${prop?escapeHtml(prop.name):'—'}</span>
        <span class="guest-col">${escapeHtml(r.guest)}</span>
        <span class="guests-col">${r.numGuests||1}</span>
        <span class="dates-col">${fmtShort(r.checkin)} → ${fmtShort(r.checkout)}${overlap?'<span class="flag">Overlaps</span>':''}</span>
        <span class="dates-col">${r.createdAt ? fmtShort(r.createdAt.slice(0,10)) : '—'}</span>
        <span class="dates-col">${(r.status==='approved' && r.reviewedAt) ? fmtShort(r.reviewedAt.slice(0,10)) : '—'}</span>
        <span class="notes-col">${escapeHtml(r.notes||'—')}</span>
        <span style="display:flex;gap:6px;justify-content:flex-end;">
          ${r.status==='pending' ? `
            <button class="btn btn-primary" style="padding:5px 10px;font-size:12px;" data-approve="${r.id}">Approve</button>
            <button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" data-decline="${r.id}">Decline</button>
          ` : `<span style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);">${r.status}</span>`}
        </span>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

function attachRequestsHandlers(){
  document.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.onclick = async ()=>{
      const rid = btn.getAttribute('data-approve');
      const r = state.requests.find(x=>x.id===rid);
      if(!r) return;
      const overlap = state.bookings.some(b=> b.status!=='deleted' && b.propertyId===r.propertyId && r.checkin < b.checkout && r.checkout > b.checkin);
      if(overlap && !(await showConfirm('This overlaps an existing booking. Approve anyway? It will show as double-booked on the board.', {confirmLabel:'Approve anyway'}))) return;
      const now = new Date().toISOString();
      state.bookings.push({id:uid(), propertyId:r.propertyId, guest:r.guest, numGuests:r.numGuests||1, checkin:r.checkin, checkout:r.checkout, notes:r.notes||'', approvedAt: now});
      r.status = 'approved';
      r.reviewedAt = now;
      await saveBookings(); await saveRequests();
      render();
    };
  });
  document.querySelectorAll('[data-decline]').forEach(btn=>{
    btn.onclick = async ()=>{
      const rid = btn.getAttribute('data-decline');
      const r = state.requests.find(x=>x.id===rid);
      if(!r) return;
      r.status = 'declined';
      r.reviewedAt = new Date().toISOString();
      await saveRequests();
      render();
    };
  });
}

  const sorted = [...state.bookings].sort((a,b)=> a.checkin < b.checkin ? -1 : (a.checkin > b.checkin ? 1 : 0));

  let html = `<div class="list-table">`;

    <span>Property</span>

    <span>Guests</span>
    <span>Dates</span>

  if(sorted.length===0){
    html += `<div class="list-empty">No bookings yet.${state.adminUnlocked ? ' Use "+ Add booking" to create one.' : ''}</div>`;

    sorted.forEach(b=>{

      const isDeleted = b.status==='deleted';

        <span class="guests-col">${b.numGuests || 1}</span>
        <span class="dates-col">${fmtShort(b.checkin)} → ${fmtShort(b.checkout)} · ${nights} night${nights===1?'':'s'}</span>
        <span class="notes-col">${escapeHtml(b.notes||'—')}</span>
        <span class="dates-col">${b.approvedAt ? fmtShort(b.approvedAt.slice(0,10)) : '—'}</span>
        <span class="dates-col">${isDeleted ? fmtShort(b.deletedAt ? b.deletedAt.slice(0,10) : today) : '—'}</span>

  return html;
}

function attachTabHandlers(){

function attachListHandlers(){
  document.querySelectorAll('[data-listedit]').forEach(btn=>{
    btn.onclick = ()=>{
      const bid = btn.getAttribute('data-listedit');
      const b = state.bookings.find(x=>x.id===bid);
      if(!b) return;
      state.modal = {type:'booking', data: state.adminUnlocked ? {...b} : {...b, readonly:true}};
      render();

  document.querySelectorAll('[data-restore]').forEach(btn=>{

function renderRow(p,y,m,dim,today){
  const relevant = state.bookings.filter(b=>{
    if(b.propertyId!==p.id || b.status==='deleted') return false;
    const {y:ciY,m:ciM,d:ciD} = parseISO(b.checkin);
    const {y:coY,m:coM,d:coD} = parseISO(b.checkout);
    const ciSerial = Date.UTC(ciY,ciM,ciD);
    const coSerial = Date.UTC(coY,coM,coD);
    const monthStart = Date.UTC(y,m,1);
    const monthEnd = Date.UTC(y,m,dim);
    return coSerial > monthStart && ciSerial <= monthEnd;
  });

  // Detect overlaps first: count how many confirmed bookings cover each visible day
  const coverage = new Array(dim+2).fill(0);
  relevant.forEach(b=>{
    const ci = parseISO(b.checkin), co = parseISO(b.checkout);
    const startD = (ci.y===y && ci.m===m) ? ci.d : 1;
    const endD = (co.y===y && co.m===m) ? co.d : dim+1; // exclusive
    for(let d=Math.max(1,startD); d<Math.min(dim+1,endD); d++){ coverage[d]++; }
  });
  const isBookingDoubled = (b)=>{
    const ci = parseISO(b.checkin), co = parseISO(b.checkout);
    const startD = (ci.y===y && ci.m===m) ? ci.d : 1;
    const endD = (co.y===y && co.m===m) ? co.d : dim+1;
    for(let d=Math.max(1,startD); d<Math.min(dim+1,endD); d++){ if(coverage[d]>=2) return true; }
    return false;
  };

  let cellsHtml = '';
  for(let d=1; d<=dim; d++){
    const dow = new Date(y,m,d).getDay();
    const weekend = dow===0||dow===6;
    const iso = isoDate(y,m,d);
    const isToday = iso===today;
    const isDoubled = coverage[d]>=2;
    cellsHtml += `<div class="day-cell ${weekend?'weekend':''} ${isToday?'today':''} ${isDoubled?'double':''} ${state.adminUnlocked?'clickable':''}" data-daycell="${p.id}|${iso}"></div>`;
  }

  let barsHtml = '';
  relevant.forEach(b=>{
    const ci = parseISO(b.checkin), co = parseISO(b.checkout);
    const ciSerialInMonth = (ci.y===y && ci.m===m) ? ci.d : 1;
    const coSerialInMonth = (co.y===y && co.m===m) ? co.d : dim+1;
    const startCol = Math.max(1, ciSerialInMonth);
    const endCol = Math.min(dim+1, coSerialInMonth);
    const clipStart = !(ci.y===y && ci.m===m);
    const clipEnd = !(co.y===y && co.m===m) || coSerialInMonth > dim+1;
    const prop = p;
    const doubled = isBookingDoubled(b); // no longer used to outline the whole bar — see bar-overlap below, which scopes to just the overlapping days
    barsHtml += `<div class="bar ${clipStart?'clip-start':''} ${clipEnd?'clip-end':''}" data-editbooking="${b.id}"
      style="grid-column:${startCol} / ${endCol}; background:${colorVar(prop.color)};" title="${doubled?'Double booked — ':''}${escapeAttr(b.guest)}">
      ${escapeHtml(b.guest)}
    </div>`;
  });

  // Pending requests render as grey bars until an admin approves or declines them
  const relevantRequests = state.requests.filter(r=>{
    if(r.propertyId!==p.id || r.status!=='pending') return false;
    const {y:ciY,m:ciM,d:ciD} = parseISO(r.checkin);
    const {y:coY,m:coM,d:coD} = parseISO(r.checkout);
    const ciSerial = Date.UTC(ciY,ciM,ciD);
    const coSerial = Date.UTC(coY,coM,coD);
    const monthStart = Date.UTC(y,m,1);
    const monthEnd = Date.UTC(y,m,dim);
    return coSerial > monthStart && ciSerial <= monthEnd;
  });
  relevantRequests.forEach(r=>{
    const ci = parseISO(r.checkin), co = parseISO(r.checkout);
    const ciSerialInMonth = (ci.y===y && ci.m===m) ? ci.d : 1;
    const coSerialInMonth = (co.y===y && co.m===m) ? co.d : dim+1;
    const startCol = Math.max(1, ciSerialInMonth);
    const endCol = Math.min(dim+1, coSerialInMonth);
    const clipStart = !(ci.y===y && ci.m===m);
    const clipEnd = !(co.y===y && co.m===m) || coSerialInMonth > dim+1;
    barsHtml += `<div class="bar bar-pending ${clipStart?'clip-start':''} ${clipEnd?'clip-end':''}" data-viewrequest="${r.id}"
      style="grid-column:${startCol} / ${endCol};">
      ${escapeHtml(r.guest)} · pending
    </div>`;
  });

  // Overlap box disabled per request — code kept for easy re-enable.
  // The day-cell red tint and the "Double booked" flag in All bookings still indicate overlaps.
  let overlapHtml = '';
  // let runStart = null;
  // for(let d=1; d<=dim+1; d++){
  //   const isDouble = d<=dim && coverage[d]>=2;
  //   if(isDouble && runStart===null) runStart = d;
  //   if(!isDouble && runStart!==null){
  //     overlapHtml += `<div class="bar-overlap" style="grid-column:${runStart} / ${d};" title="Double booked"></div>`;
  //     runStart = null;
  //   }
  // }

  return `<div class="prop-row" style="grid-template-columns:repeat(${dim},minmax(30px,1fr));">
    ${cellsHtml}
    ${barsHtml}
    ${overlapHtml}
  </div>`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function attachTopHandlers(){
  document.getElementById('adminToggle').onclick = ()=>{
    if(state.adminUnlocked){ state.adminUnlocked=false; render(); }
    else { state.modal = {type: state.pinSet ? 'pin' : 'setpin'}; render(); }
  };
  const reqBtn = document.getElementById('openRequestDates');
  if(reqBtn) reqBtn.onclick = ()=>{
    state.modal = {type:'request', data:{propertyId: state.properties[0]?.id || '', guest:'', numGuests:1, checkin:'', checkout:'', notes:''}};
    render();
  };
}

function attachHandlers(y,m,dim){
  document.getElementById('prevMonth').onclick = ()=>{
    if(state.viewYear===RANGE_START.y && state.viewMonth===RANGE_START.m) return;
    state.viewMonth--; if(state.viewMonth<0){state.viewMonth=11; state.viewYear--;}
    render();
  };
  document.getElementById('nextMonth').onclick = ()=>{
    if(state.viewYear===RANGE_END.y && state.viewMonth===RANGE_END.m) return;
    state.viewMonth++; if(state.viewMonth>11){state.viewMonth=0; state.viewYear++;}
    render();
  };

  if(state.adminUnlocked){
    const openAddBtn = document.getElementById('openAddBooking');
    if(openAddBtn) openAddBtn.onclick = ()=>{
      const seasonStart = isoDate(RANGE_START.y, RANGE_START.m, 1);
      const seasonEndExclusive = isoDate(RANGE_END.y, RANGE_END.m, 1);
      let ci = todayISO();
      if(ci < seasonStart) ci = seasonStart;
      if(ci >= seasonEndExclusive) ci = isoDate(RANGE_END.y, RANGE_END.m, 1 > 1 ? 1 : 1);
      const {y:ciY,m:ciM,d:ciD} = parseISO(ci);
      const co = isoDate(ciY, ciM, ciD+1);
      state.modal = {type:'booking', data:{id:null, propertyId: state.properties[0]?.id || '', guest:'', checkin:ci, checkout:co, notes:''}};
      render();
    };
    document.querySelectorAll('[data-rename]').forEach(inp=>{
      inp.onchange = async (e)=>{
        const pid = inp.getAttribute('data-rename');
        const prop = state.properties.find(p=>p.id===pid);
        if(prop){ prop.name = e.target.value.trim() || prop.name; await saveProperties(); render(); }
      };
    });
    document.querySelectorAll('[data-delprop]').forEach(btn=>{
      btn.onclick = async ()=>{
        const pid = btn.getAttribute('data-delprop');
        const hasBookings = state.bookings.some(b=>b.propertyId===pid);
        if(hasBookings && !(await showConfirm('This property has bookings. Remove it and its bookings?', {confirmLabel:'Remove'}))) return;
        state.properties = state.properties.filter(p=>p.id!==pid);
        state.bookings = state.bookings.filter(b=>b.propertyId!==pid);
        await saveProperties(); await saveBookings(); render();
      };
    });
    const addProp = document.getElementById('addProp');
    if(addProp) addProp.onclick = async ()=>{
      const usedColors = state.properties.map(p=>p.color);
      const color = PALETTE.find(c=>!usedColors.includes(c)) || PALETTE[state.properties.length % PALETTE.length];
      state.properties.push({id:uid(), name:`Property ${String.fromCharCode(65+state.properties.length)}`, color});
      await saveProperties(); render();
    };
    document.querySelectorAll('[data-daycell]').forEach(cell=>{
      cell.onclick = ()=>{
        const [pid, iso] = cell.getAttribute('data-daycell').split('|');
        const {y:dy,m:dm,d:dd} = parseISO(iso);
        const checkoutIso = isoDate(dy,dm,dd+1);
        state.modal = {type:'booking', data:{id:null, propertyId:pid, guest:'', checkin:iso, checkout:checkoutIso, notes:''}};
        render();
      };
    });
    const resetBtn = document.getElementById('resetData');
    if(resetBtn) resetBtn.onclick = ()=>{
      if(state.bookings.length===0 && state.requests.length===0) return;
      state.modal = {type:'clearAll'};
      render();
    };
  }

  document.querySelectorAll('[data-editbooking]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const bid = el.getAttribute('data-editbooking');
      const b = state.bookings.find(x=>x.id===bid);
      if(!b) return;
      state.modal = {type:'booking', data: state.adminUnlocked ? {...b} : {...b, readonly:true}};
      render();
    };
  });

  document.querySelectorAll('[data-viewrequest]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const rid = el.getAttribute('data-viewrequest');
      const r = state.requests.find(x=>x.id===rid);
      if(!r) return;
      state.modal = {type:'requestReview', data:{...r}};
      render();
    };
  });
}

function renderModal(){
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay){ closeModal(); } };

  const mtype = state.modal.type;

  if(mtype==='setpin' || mtype==='pin'){
    const isSet = mtype==='setpin';
    overlay.innerHTML = `<div class="modal">
      <h3>${isSet ? 'Set an admin PIN' : 'Enter admin PIN'}</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 14px 0;">
        ${isSet ? 'This is a light gate to stop casual edits — not real security. Anyone with the PIN can edit.' : 'Unlock to add or edit bookings.'}
      </p>
      <div class="field">
        <input type="password" id="pinInput" placeholder="4+ digit PIN" style="letter-spacing:.2em;font-family:'JetBrains Mono',monospace;">
      </div>
      <div class="err" id="pinErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pinCancel">Cancel</button>
        <div class="right"><button class="btn btn-primary" id="pinSubmit">${isSet?'Set PIN':'Unlock'}</button></div>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('pinCancel').onclick = closeModal;
    const input = document.getElementById('pinInput');
    input.focus();
    const submit = async ()=>{
      const val = input.value.trim();
      if(isSet){
        if(val.length<4){ document.getElementById('pinErr').textContent='Use at least 4 characters.'; return; }
        await savePin(val);
        state.adminUnlocked = true;
        closeModal();
      } else {
        const stored = await storageGet(STORAGE_KEYS.pin);
        if(stored && String(stored.value)===String(val)){ state.adminUnlocked=true; closeModal(); }
        else if(!stored){ document.getElementById('pinErr').textContent = `Couldn't check the PIN (${lastStorageError || 'no response from the sheet'}).`; }
        else { document.getElementById('pinErr').textContent='Incorrect PIN.'; }
      }
    };
    document.getElementById('pinSubmit').onclick = submit;
    input.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
    return;
  }

  if(mtype==='booking'){
    const d = state.modal.data;
    const readonly = d.readonly || !state.adminUnlocked;
    overlay.innerHTML = `<div class="modal">
      <h3>${d.id ? (readonly?'Booking details':'Edit booking') : 'New booking'}</h3>
      <div class="field">
        <label>Property</label>
        <select id="f-property" ${readonly?'disabled':''}>
          ${state.properties.map(p=>`<option value="${p.id}" ${p.id===d.propertyId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Guest name</label>
          <input id="f-guest" value="${escapeAttr(d.guest||'')}" placeholder="e.g. Jamie Rivera" ${readonly?'disabled':''}>
        </div>
        <div class="field" style="max-width:110px;">
          <label># of guests</label>
          <input type="number" id="f-numguests" min="1" step="1" value="${d.numGuests || 1}" ${readonly?'disabled':''}>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Check-in</label>
          <input type="date" id="f-checkin" value="${d.checkin}" min="${isoDate(RANGE_START.y,RANGE_START.m,1)}" max="${isoDate(RANGE_END.y,RANGE_END.m,1)}" ${readonly?'disabled':''}>
        </div>
        <div class="field">
          <label>Check-out</label>
          <input type="date" id="f-checkout" value="${d.checkout}" min="${isoDate(RANGE_START.y,RANGE_START.m,1)}" max="${isoDate(RANGE_END.y,RANGE_END.m,1)}" ${readonly?'disabled':''}>
        </div>
      </div>
      <div class="field">
        <label>Notes</label>
        <input id="f-notes" value="${escapeAttr(d.notes||'')}" placeholder="Optional" ${readonly?'disabled':''}>
      </div>
      <div class="err" id="bookingErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="bookingCancel">${readonly?'Close':'Cancel'}</button>
        <div class="right">
          ${(!readonly && d.id) ? `<button class="btn btn-danger" id="bookingDelete">Delete</button>` : ''}
          ${!readonly ? `<button class="btn btn-primary" id="bookingSave">${d.id?'Save':'Add booking'}</button>` : ''}
        </div>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('bookingCancel').onclick = closeModal;
    if(!readonly){
      const saveBtn = document.getElementById('bookingSave');
      saveBtn.onclick = async ()=>{
        if(saveBtn.disabled) return;
        const guest = document.getElementById('f-guest').value.trim();
        const numGuests = Math.max(1, parseInt(document.getElementById('f-numguests').value, 10) || 1);
        const propertyId = document.getElementById('f-property').value;
        const checkin = document.getElementById('f-checkin').value;
        const checkout = document.getElementById('f-checkout').value;
        const notes = document.getElementById('f-notes').value.trim();
        const errEl = document.getElementById('bookingErr');
        if(!guest){ errEl.textContent='Guest name is required.'; return; }
        if(!checkin || !checkout || checkout <= checkin){ errEl.textContent='Check-out must be after check-in.'; return; }
        const overlap = state.bookings.some(b=> b.status!=='deleted' && b.propertyId===propertyId && b.id!==d.id && checkin < b.checkout && checkout > b.checkin);
        if(overlap && !(await showConfirm('This overlaps an existing booking for that property. Save anyway? It will show as double-booked on the board.', {confirmLabel:'Save anyway'}))) return;
        saveBtn.disabled = true;
        if(d.id){
          const b = state.bookings.find(x=>x.id===d.id);
          Object.assign(b, {propertyId, guest, numGuests, checkin, checkout, notes});
        } else {
          state.bookings.push({id:uid(), propertyId, guest, numGuests, checkin, checkout, notes, approvedAt: new Date().toISOString()});
        }
        await saveBookings();
        closeModal();
      };
      if(d.id){
        document.getElementById('bookingDelete').onclick = async ()=>{
          if(!(await showConfirm('This will remove it from the calendar and upcoming list. It stays visible (and restorable) in the All bookings list.', {confirmLabel:'Delete', title:'Delete this booking?'}))) return;
          const b = state.bookings.find(x=>x.id===d.id);
          if(b){ b.status='deleted'; b.deletedAt = new Date().toISOString(); }
          await saveBookings();
          closeModal();
        };
      }
    }
    return;
  }

  if(mtype==='request'){
    const d = state.modal.data;
    overlay.innerHTML = `<div class="modal">
      <h3>Request dates</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 14px 0;">
        Send a request to the property manager. This won't confirm a booking — they'll review and approve it.
      </p>
      <div class="field">
        <label>Property</label>
        <select id="r-property">
          ${state.properties.map(p=>`<option value="${p.id}" ${p.id===d.propertyId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Your name</label>
          <input id="r-guest" value="${escapeAttr(d.guest||'')}" placeholder="e.g. Jamie Rivera">
        </div>
        <div class="field" style="max-width:110px;">
          <label># of guests</label>
          <input type="number" id="r-numguests" min="1" step="1" value="${d.numGuests || 1}">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Check-in</label>
          <input type="date" id="r-checkin" value="${d.checkin}" min="${isoDate(RANGE_START.y,RANGE_START.m,1)}" max="${isoDate(RANGE_END.y,RANGE_END.m,1)}">
        </div>
        <div class="field">
          <label>Check-out</label>
          <input type="date" id="r-checkout" value="${d.checkout}" min="${isoDate(RANGE_START.y,RANGE_START.m,1)}" max="${isoDate(RANGE_END.y,RANGE_END.m,1)}">
        </div>
      </div>
      <div class="field">
        <label>Message (optional)</label>
        <input id="r-notes" value="${escapeAttr(d.notes||'')}" placeholder="Anything the manager should know">
      </div>
      <div class="err" id="requestErr"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="requestCancel">Cancel</button>
        <div class="right"><button class="btn btn-primary" id="requestSend">Send request</button></div>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('requestCancel').onclick = closeModal;
    const sendBtn = document.getElementById('requestSend');
    sendBtn.onclick = async ()=>{
      if(sendBtn.disabled) return; // guard against double-click / double-tap submitting twice
      const guest = document.getElementById('r-guest').value.trim();
      const numGuests = Math.max(1, parseInt(document.getElementById('r-numguests').value, 10) || 1);
      const propertyId = document.getElementById('r-property').value;
      const checkin = document.getElementById('r-checkin').value;
      const checkout = document.getElementById('r-checkout').value;
      const notes = document.getElementById('r-notes').value.trim();
      const errEl = document.getElementById('requestErr');
      if(!guest){ errEl.textContent='Please add your name.'; return; }
      if(!checkin || !checkout || checkout <= checkin){ errEl.textContent='Check-out must be after check-in.'; return; }
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      const newReq = {id:uid(), propertyId, guest, numGuests, checkin, checkout, notes, status:'pending', createdAt: new Date().toISOString()};
      state.requests.push(newReq);
      const saved = await saveRequests();
      closeModal();
      const propName = state.properties.find(p=>p.id===propertyId)?.name || '';
      if(saved){
        state.modal = {type:'confirm', message:"Request sent — you'll hear back once it's reviewed."};
      } else {
        // The write didn't actually persist (this can happen for visitors who aren't signed in) —
        // don't show a false "sent" confirmation. Roll back the local copy and offer a real fallback.
        state.requests = state.requests.filter(r=>r.id!==newReq.id);
        state.modal = {
          type:'confirm',
          message:`Your request couldn't be saved to the board right now (${lastStorageError || 'unknown error'}). Please email it directly instead so it isn't lost.`,
          mailto: buildRequestMailto(newReq, propName),
        };
      }
      render();
    };
    return;
  }

  if(mtype==='requestReview'){
    const r = state.modal.data;
    const prop = state.properties.find(p=>p.id===r.propertyId);
    const overlap = state.bookings.some(b=> b.status!=='deleted' && b.propertyId===r.propertyId && r.checkin < b.checkout && r.checkout > b.checkin);
    overlay.innerHTML = `<div class="modal">
      <h3>Pending request</h3>
      <div class="field"><label>Property</label><div style="font-size:14px;">${prop?escapeHtml(prop.name):'—'}</div></div>
      <div class="field"><label>Requested by</label><div style="font-size:14px;">${escapeHtml(r.guest)} · ${r.numGuests||1} guest${(r.numGuests||1)===1?'':'s'}</div></div>
      <div class="field"><label>Dates</label><div style="font-size:14px;font-family:'JetBrains Mono',monospace;">${fmtShort(r.checkin)} → ${fmtShort(r.checkout)}</div></div>
      ${r.notes ? `<div class="field"><label>Message</label><div style="font-size:13.5px;color:var(--ink-soft);">${escapeHtml(r.notes)}</div></div>` : ''}
      ${overlap ? `<div class="err" style="margin-bottom:12px;">Heads up — this overlaps an existing confirmed booking.</div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-ghost" id="reqReviewClose">Close</button>
        ${state.adminUnlocked ? `<div class="right">
          <button class="btn btn-danger" id="reqReviewDecline">Decline</button>
          <button class="btn btn-primary" id="reqReviewApprove">Approve</button>
        </div>` : ''}
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('reqReviewClose').onclick = closeModal;
    if(state.adminUnlocked){
      document.getElementById('reqReviewApprove').onclick = async ()=>{
        if(overlap && !(await showConfirm('This overlaps an existing booking. Approve anyway? It will show as double-booked on the board.', {confirmLabel:'Approve anyway'}))) return;
        const req = state.requests.find(x=>x.id===r.id);
        if(req){
          const now = new Date().toISOString();
          state.bookings.push({id:uid(), propertyId:req.propertyId, guest:req.guest, numGuests:req.numGuests||1, checkin:req.checkin, checkout:req.checkout, notes:req.notes||'', approvedAt: now});
          req.status = 'approved';
          req.reviewedAt = now;
          await saveBookings(); await saveRequests();
        }
        closeModal();
      };
      document.getElementById('reqReviewDecline').onclick = async ()=>{
        const req = state.requests.find(x=>x.id===r.id);
        if(req){ req.status = 'declined'; req.reviewedAt = new Date().toISOString(); await saveRequests(); }
        closeModal();
      };
    }
    return;
  }

  if(mtype==='clearAll'){
    overlay.innerHTML = `<div class="modal">
      <h3>Are you sure you want to clear all data?</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 18px 0;">
        This permanently deletes every booking and request for everyone who opens this board. Your properties and their names stay put. This can't be undone.
      </p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="clearAllCancel">No</button>
        <div class="right"><button class="btn btn-danger" id="clearAllConfirm">Yes, clear it</button></div>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('clearAllCancel').onclick = closeModal;
    document.getElementById('clearAllConfirm').onclick = async ()=>{
      state.bookings = []; state.requests = [];
      await saveBookings(); await saveRequests();
      closeModal();
    };
    return;
  }

  if(mtype==='confirm'){
    const mailto = state.modal.mailto;
    overlay.innerHTML = `<div class="modal">
      <h3>Thanks!</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 18px 0;">${escapeHtml(state.modal.message||'')}</p>
      ${mailto ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 16px 0;">Automatic email isn't set up yet — send one now so the manager sees it right away.</p>` : ''}
      <div class="modal-actions" style="justify-content:flex-end;">
        ${mailto ? `<a class="btn btn-primary" href="${mailto}" style="text-decoration:none;" id="confirmMailto">Notify by email</a>` : ''}
        <button class="btn ${mailto?'btn-ghost':'btn-primary'}" id="confirmClose">Close</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('confirmClose').onclick = closeModal;
    return;
  }
}

function closeModal(){
  state.modal = null;
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  render();
}

load();
</script>
</body>
</html>
